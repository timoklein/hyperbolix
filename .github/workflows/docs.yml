name: Documentation

on:
  push:
    branches: [main, documentation]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for mike versioning

      # Pinned exactly: setup-uv has no moving major tag since v8.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Vendor MathJax (pinned + integrity-checked, self-hosted)
        run: uv run python scripts/vendor_mathjax.py

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Audit external resource hosts
        run: uv run python scripts/check_external_hosts.py site

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: site/
          retention-days: 30

      - name: Deploy to GitHub Pages (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          uv run mike deploy --push --update-aliases latest main
          uv run mike set-default --push latest
