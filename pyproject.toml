# GENERAL

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project]
name = "hyperbolix"
version = "1.2.0"
description = "Hyperbolic Deep Learning in JAX"
authors = [
    { name="Timo Klein", email="timo.klein@univie.ac.at" },
    { name="Thomas Lang", email="thomas.lang@univie.ac.at" }
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = [
    "hyperbolic",
    "deep-learning",
    "jax",
    "flax",
    "machine-learning",
    "riemannian",
    "poincare",
    "hyperboloid",
    "neural-networks",
    "geometric-deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "chex>=0.1.91",
    "flax>=0.12.0",
    "jax>=0.9",
    "jaxtyping>=0.3.2",
    "optax>=0.2.6",
]

[project.urls]
Homepage = "https://github.com/timoklein/hyperbolix"
Documentation = "https://timoklein.github.io/hyperbolix/"
Repository = "https://github.com/timoklein/hyperbolix"
Issues = "https://github.com/timoklein/hyperbolix/issues"
Changelog = "https://github.com/timoklein/hyperbolix/releases"

[tool.uv.build-backend]
module-root = ""

#----------------------------
# RUFF
#----------------------------

[tool.ruff]
# See https://beta.ruff.rs/docs/rules/
lint.select = ["E", "F", "B", "UP", "C90", "RUF"]
# B028: Ignore explicit stacklevel`
# RUF013: Too many false positives (implicit optional)
# F722: jaxtyping multi-axis shape strings (`Float[Array, "batch dim"]`) parse as syntax errors
lint.ignore = ["B028", "RUF013", "F722"]

# F821 (undefined name) is on everywhere except the library tree. ruff reads every jaxtyping
# shape string as a forward reference, so `Float[Array, "dim"]` becomes "undefined name `dim`":
# 572 such hits across 16 files in hyperbolix/, and zero true positives. The jaxtyping FAQ's
# workaround is to rewrite every single-axis annotation as `" dim"` so the hit becomes the
# already-ignored F722 -- not worth 572 edits. Undefined names in hyperbolix/ are instead
# caught by pyright's reportUndefinedVariable (see [tool.pyright] below), which resolves
# jaxtyping properly and reports none of these. tests/ has no jaxtyping annotations, so F821
# runs there unrestricted. (The per-file-ignore itself lives at the end of this section --
# a sub-table header would otherwise swallow the plain keys that follow it.)

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

lint.mccabe.max-complexity = 15

# Exclude a variety of commonly ignored directories.
exclude = [
    "*.egg-info",
    "__pycache__",
    ".git",
    ".venv",
    ".ruff_cache",
]

line-length = 127

[tool.ruff.lint.per-file-ignores]
# See the F821 note above: jaxtyping shape strings, 572 false positives, no true ones.
"hyperbolix/**/*.py" = ["F821"]

#----------------------------
# DEV
#----------------------------


[tool.pytest.ini_options]
# --import-mode=importlib: keeps pytest from prepending the repo root (and, with the old
# `pythonpath = "hyperbolix"` entry, <root>/hyperbolix) to sys.path ahead of PYTHONPATH.
# That prepending silently shadowed a checkout named on PYTHONPATH, so a "does this fail on
# the parent commit?" run executed the branch's own code. `tests/conftest.py` additionally
# guards the case at import time. The dropped `pythonpath = "hyperbolix"` entry dates back to
# the PyTorch removal (bc6a0ef) and is unused: no module imports `manifolds`/`utils`/... as
# top-level names.
# --no-header instead of -q: -q trims the same header, but a caller who adds their own -q (a
# wrapper, a habit, `pytest -q -n auto`) then lands at quiet level 2, and level 2 drops the
# final `N passed, M failed in Xs` line -- leaving the dot stream and the exit code as the only
# way to read the counts. --no-header keeps the output just as short and cannot be pushed over
# that threshold from the command line. -ra keeps the short summary of non-passing tests.
addopts = "-ra --no-header --import-mode=importlib" # --log-cli-level=DEBUG
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.2",
    "mike>=2.1.3",
    "pre-commit>=4.0.1",
    "py-spy>=0.4.1",
    "pyright>=1.1.390",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
    "pytest-xdist>=3.8.0",
]


#----------------------------
# PYRIGHT
#----------------------------

[tool.pyright]
# `exclude` used to list "hyperbolix" alongside `include = ["hyperbolix"]`, so pyright analysed
# 0 of the 57 modules and reported "0 errors" no matter what was in them -- which is how four
# modules referencing an undefined name reached main. The tree is analysed under
# `typeCheckingMode = "basic"` and is clean: 0 errors, no rule disabled and no `# type: ignore`
# added to get there. The 110 errors basic mode reported when it was first switched on were
# almost all the `Curvature` union (scalar | sequence) reaching arithmetic that only the scalar
# arm supports; every single manifold, and the `Manifold` protocol itself, is now annotated with
# `ScalarCurvature`, and only `ProductManifold` keeps the union.
# The explicit rules below are kept on top of the mode: they are error-grade here regardless of
# what a future mode change would make them. reportUndefinedVariable in particular is the one
# ruff cannot do -- pyright resolves jaxtyping shape strings properly and reports none of ruff's
# 572 F821 false positives.
include = ["hyperbolix"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportUndefinedVariable = "error"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportDuplicateImport = true
